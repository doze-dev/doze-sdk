# Build + test the doze SDK on every PR and push. The SDK had no CI, yet it holds
# the load-bearing plugin protocol: `go test ./...` here runs the real plugin
# round-trip (TestEchoRoundTrip builds + launches the echo plugin over gRPC), the
# config-decode-over-the-wire test (kvtest), the capability-discovery table test,
# and the binaries fetcher/lock tests — on both Linux and macOS.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  # The plugin protocol is a contract with every published module: it may only
  # grow (plugin/proto/PROTOCOL.md). buf breaking compares it with the last
  # release; the generated code must match engine.proto exactly.
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Lint
        working-directory: plugin/proto
        run: buf lint
      - name: No breaking change since the last release
        working-directory: plugin/proto
        run: |
          last=$(git describe --tags --abbrev=0 --match "v*" HEAD^ 2>/dev/null || true)
          if [ -z "$last" ]; then echo "no release to compare with"; exit 0; fi
          echo "against $last"
          buf breaking --against "../../.git#ref=$last,subdir=plugin/proto"
      - name: Generated code matches engine.proto
        run: |
          go generate ./plugin/proto
          git diff --exit-code -- plugin/proto
          test -z "$(git status --porcelain -- plugin/proto)"
