# The plugin protocol: the one contract between doze and its modules.
# PROTOCOL.md says how it may change; `buf breaking` checks it in CI.
version: v2
modules:
  - path: .
breaking:
  use:
    - WIRE_JSON
    # WIRE_JSON alone allows removing an RPC, and an old host calling it would
    # get Unimplemented. Nothing is ever removed.
    - RPC_NO_DELETE
    - SERVICE_NO_DELETE
    - PACKAGE_NO_DELETE
lint:
  use:
    - MINIMAL
  except:
    # The file sits beside its generated Go package, not under dozeplugin/v1;
    # moving it would move the import path every module uses.
    - PACKAGE_DIRECTORY_MATCH
